[tox]
# 4.11.0 is the first tox that does not pass an empty `--build-option` config setting
# to the build backend; scikit-build-core rejects it as an unknown option (exit code 7).
# The minimum-version CI job installs exactly this version.
minversion = 4.11.0
envlist = py{311,312,313}, lint, coverage, docs
isolated_build = True

[testenv]
package = wheel
# The wheel has a compiled extension (pybind11), so it is ABI-specific. Build a wheel per
# interpreter so each env installs one that matches its own Python.
wheel_build_env = .pkg-{basepython}
parallel_show_output = True
extras =
  dev
commands =
  pytest {posargs}

[testenv:style]
extras =
  dev
commands =
  black src/ tests/
  ruff check --fix src/ tests/

[testenv:lint]
basepython = python3.11
deps =
  reno>=4.1
extras =
  dev
commands =
  black --check src/ tests/
  ruff check src/ tests/
  ruff check --preview --select CPY001 src/ tests/
  pymarkdown --config .pymarkdown.json scan README.md
  reno lint

[testenv:coverage]
basepython = python3.11
deps =
  coverage>=7.4.1
extras =
  dev
commands =
  coverage run --source swapnet --parallel-mode -m pytest tests/ {posargs}
  coverage combine
  coverage report --show-missing
  coverage html

[testenv:docs]
basepython = python3.11
# The wheel has a compiled extension (pybind11), so it is ABI-specific. Build it with the same
# interpreter that installs it: the shared .pkg env follows the launching interpreter, which
# would otherwise produce a cp312 wheel that the python3.11 docs env rejects.
wheel_build_env = .pkg-docs
extras =
  docs
commands =
  sphinx-build -j auto -W -T --keep-going -b html {posargs} {toxinidir}/docs/ {toxinidir}/docs/_build/html
passenv =
  CI
  GITHUB_BASE_REF
  GITHUB_REF_NAME

[testenv:.pkg-python3.11]
basepython = python3.11

[testenv:.pkg-py311]
basepython = py311

[testenv:.pkg-py312]
basepython = py312

[testenv:.pkg-py313]
basepython = py313

[testenv:.pkg-docs]
basepython = python3.11

[testenv:docs-clean]
skip_install = true
allowlist_externals =
  rm
commands =
  rm -rf {toxinidir}/docs/stubs/ {toxinidir}/docs/_build/
